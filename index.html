<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SUBWIN11 · Windows 11</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --win-bg: #ffffff;
      --win-text: #1a1a1a;
      --win-text-dim: #555;
      --accent: #0067c0;
      --accent-glow: rgba(0, 103, 192, 0.35);
      --taskbar-h: 48px;
      --win-radius: 12px;
      --glass: rgba(243, 243, 243, 0.85);
      --border-light: rgba(0, 0, 0, 0.1);
      --tray-hover: rgba(0, 0, 0, 0.06);
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
    }

    #fs-hint {
      position: fixed;
      bottom: calc(var(--taskbar-h) + 16px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 12px;
      letter-spacing: 0.2px;
      padding: 9px 18px;
      border-radius: 20px;
      z-index: 10000;
      pointer-events: none;
      display: none;
      opacity: 1;
      transition: opacity 0.45s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      white-space: nowrap;
    }
    #fs-hint.hide { opacity: 0; }
    @media (max-width: 380px) { #fs-hint { font-size: 11px; padding: 7px 14px; } }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-logo {
      width: 90px; height: auto; margin-bottom: 44px;
      filter: drop-shadow(0 0 30px rgba(76, 194, 255, 0.25));
    }
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .desktop {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background-image: url('https://raw.githubusercontent.com/notAperson535/Win11-HTML/c4289ccd494bea102381b6f0765c0d4fd802c9c3/img/backgroundlight.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: filter 0.3s ease;
    }
    .desktop.blurred { filter: blur(6px) brightness(0.9); }

    .desktop-surface {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      height: 100%;
    }

    .desktop-icons-container {
      position: absolute;
      top: 10px; left: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }
    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 56px;
      padding: 5px 4px;
      border-radius: 3px;
      cursor: pointer;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.85);
      transition: background 0.1s;
    }
    .desktop-icon img {
      width: 32px;
      height: 32px;
      margin-bottom: 3px;
      object-fit: contain;
      pointer-events: none;
    }
    .desktop-icon span {
      font-size: 9.5px;
      line-height: 1.15;
      text-align: center;
      pointer-events: none;
    }
    .desktop-icon:hover { background: rgba(255,255,255,0.15); }
    .desktop-icon:active,
    .desktop-icon.selected { background: rgba(0, 120, 215, 0.45); }

    #selection-box {
      position: absolute;
      border: 1px solid #0078D7;
      background: rgba(0, 120, 215, 0.3);
      border-radius: 2px;
      display: none;
      z-index: 10;
      pointer-events: none;
    }

    .context-menu {
      position: absolute;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      padding: 5px;
      display: none;
      z-index: 500;
      min-width: 160px;
    }
    .context-item {
      padding: 7px 11px;
      font-size: 12px;
      color: #000;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .context-item:hover { background: rgba(0,0,0,0.06); }
    .context-item i { width: 14px; text-align: center; font-size: 12px; color: #444; }
    .context-sep { height: 1px; background: rgba(0,0,0,0.08); margin: 4px 6px; }

    .taskbar {
      position: relative;
      z-index: 100;
      height: var(--taskbar-h);
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(1.6);
      -webkit-backdrop-filter: blur(30px) saturate(1.6);
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
    }

    .weather-widget {
      position: absolute;
      left: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
      cursor: pointer;
      padding: 0 5px;
      border-radius: 4px;
      transition: background 0.12s;
    }
    .weather-widget:hover { background: var(--tray-hover); }
    .weather-widget img { width: 20px; height: 20px; object-fit: contain; }
    .weather-info { display: flex; flex-direction: column; color: #000; line-height: 1.15; }
    .weather-temp { font-size: 11px; font-weight: 600; }
    .weather-desc { font-size: 9.5px; opacity: 0.75; }

    .taskbar-center { display: flex; align-items: center; gap: 3px; height: 100%; }

    .taskbar-icon {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s, transform 0.08s;
      position: relative;
      touch-action: manipulation;
    }
    .taskbar-icon img { width: 22px; height: 22px; object-fit: contain; pointer-events: none; }
    .taskbar-icon[data-app="start"] img { width: 24px; height: 24px; }
    .taskbar-icon:hover { background: rgba(0,0,0,0.06); }
    .taskbar-icon:active { transform: scale(0.88); }

    .taskbar-icon.active-app::after {
      content: '';
      position: absolute;
      bottom: 1px; left: 50%;
      transform: translateX(-50%);
      width: 14px; height: 3px;
      background: var(--accent);
      border-radius: 2px;
    }

    .taskbar-search {
      display: flex; align-items: center;
      height: 32px; width: 200px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 0 10px; gap: 6px;
      margin: 0 6px;
      cursor: text;
      transition: background 0.2s, border-color 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .taskbar-search:hover { background: #f9f9f9; border-color: rgba(0, 0, 0, 0.25); }
    .taskbar-search img { width: 14px; height: 14px; filter: brightness(0); pointer-events: none; }
    .taskbar-search input {
      background: transparent; border: none; outline: none;
      color: #000; font-size: 12px; width: 100%; font-family: inherit;
      cursor: text; pointer-events: auto;
    }
    .taskbar-search input::placeholder { color: #666; }

    .taskbar-tray {
      position: absolute; right: 6px;
      display: flex; align-items: center; gap: 1px;
      color: #000; font-size: 12px;
      height: 100%;
    }

    .tray-item {
      display: flex; align-items: center; justify-content: center;
      height: 30px; padding: 0 5px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
      gap: 3px;
    }
    .tray-item:hover { background: var(--tray-hover); }
    .tray-item:active { background: rgba(0,0,0,0.12); }
    .tray-item img {
      width: 15px; height: 15px;
      object-fit: contain;
      filter: brightness(0);
      pointer-events: none;
    }

    .lang-stacked {
      display: flex; flex-direction: column; align-items: center;
      line-height: 1.05; font-size: 9.5px; font-weight: 600;
      letter-spacing: 0.4px; color: #000;
    }
    .lang-stacked span:first-child { opacity: 1; }
    .lang-stacked span:last-child { opacity: 0.6; }

    .tray-clock {
      display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
      padding: 0 8px; cursor: pointer; border-radius: 4px;
      height: 34px; color: #000;
    }
    .tray-clock:hover { background: var(--tray-hover); }
    .tray-clock span {
      font-size: 10.5px; font-weight: 400; letter-spacing: 0.4px; line-height: 1.2;
    }

    .tray-flyout {
      position: fixed;
      bottom: calc(var(--taskbar-h) + 8px);
      right: 12px;
      width: 240px;
      background: rgba(243, 243, 243, 0.96);
      backdrop-filter: blur(30px) saturate(1.5);
      -webkit-backdrop-filter: blur(30px) saturate(1.5);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border: 1px solid rgba(0,0,0,0.1);
      z-index: 250;
      padding: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tray-flyout.open { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .flyout-title {
      font-size: 12px; font-weight: 600; color: #000;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      margin-bottom: 4px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .flyout-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0; font-size: 12px; color: #333;
      cursor: pointer; border-radius: 4px;
    }
    .flyout-row:hover { color: #000; background: rgba(0,0,0,0.05); }
    .flyout-row.active { color: var(--accent); font-weight: 600; }

    .settings-toggle {
      width: 38px; height: 20px; border-radius: 10px; background: #ccc;
      position: relative; cursor: pointer; transition: background 0.2s;
    }
    .settings-toggle.on { background: var(--accent); }
    .settings-toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      transition: transform 0.2s;
    }
    .settings-toggle.on::after { transform: translateX(18px); }

    .start-menu {
      position: fixed;
      bottom: calc(var(--taskbar-h) + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(18px);
      width: min(600px, 92vw);
      height: 560px;
      background: rgba(243, 243, 243, 0.96);
      backdrop-filter: blur(40px) saturate(1.5);
      -webkit-backdrop-filter: blur(40px) saturate(1.5);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      z-index: 200;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .start-menu.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }

    .start-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px 8px;
      font-weight: 600; color: #000; font-size: 13px;
    }
    .all-apps-btn { cursor: pointer; }

    .start-apps {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 1px;
      padding: 0 12px 12px;
      overflow-y: auto;
      align-content: start;
    }
    .start-app-item {
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 3px; border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s;
      color: #000;
      touch-action: manipulation;
    }
    .start-app-item:hover { background: rgba(0,0,0,0.05); }
    .start-app-item:active { background: rgba(0,0,0,0.1); transform: scale(0.93); }
    .start-app-item img { width: 26px; height: 26px; margin-bottom: 4px; object-fit: contain; pointer-events: none; }
    .start-app-item span { font-size: 10px; text-align: center; line-height: 1.15; }

    .window {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.94);
      width: min(840px, 92vw);
      height: min(560px, 74vh);
      background: #ffffff;
      border-radius: var(--win-radius);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      z-index: 300;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.15);
    }
    .window.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

    .window-header {
      height: 36px;
      background: #f3f3f3;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 0 0 12px;
      border-bottom: 1px solid #e0e0e0;
      cursor: grab;
      flex-shrink: 0;
    }
    .window-header:active { cursor: grabbing; }

    .window-title { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #000; }
    .window-title img { width: 15px; height: 15px; object-fit: contain; pointer-events: none; }

    .window-controls { display: flex; height: 100%; }
    .win-btn {
      width: 42px; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #000;
      cursor: pointer;
      transition: background 0.1s;
      touch-action: manipulation;
    }
    .win-btn:hover { background: rgba(0,0,0,0.08); }
    .win-btn.close:hover { background: #e81123; color: #fff; }
    .win-btn img { width: 11px; height: 11px; filter: brightness(0); pointer-events: none; }
    .win-btn.close:hover img { filter: brightness(0) invert(1); }

    .window-body {
      flex: 1;
      overflow: auto;
      padding: 14px;
      color: var(--win-text);
      font-size: 13px;
      line-height: 1.5;
      -webkit-overflow-scrolling: touch;
      background: #ffffff;
    }

    .explorer-layout { display: flex; gap: 0; height: 100%; color: #333; }
    .explorer-nav { width: 180px; flex-shrink: 0; border-right: 1px solid #e0e0e0; padding-right: 8px; overflow-y: auto; }
    .explorer-nav-item { display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 5px; font-size: 12px; color: #555; cursor: pointer; transition: background 0.1s; }
    .explorer-nav-item:hover { background: rgba(0,0,0,0.05); color: #000; }
    .explorer-nav-item.active { background: rgba(0, 103, 192, 0.1); color: var(--accent); }
    .explorer-nav-item i { width: 15px; text-align: center; font-size: 12px; }
    .explorer-content { flex: 1; padding-left: 14px; overflow-y: auto; }
    .explorer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 4px; }
    .explorer-folder { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 5px; border-radius: 6px; cursor: pointer; transition: background 0.1s; text-align: center; }
    .explorer-folder:hover { background: rgba(0,0,0,0.05); }
    .explorer-folder:active { background: rgba(0,0,0,0.1); transform: scale(0.95); }
    .explorer-folder img { width: 34px; height: 34px; object-fit: contain; pointer-events: none; }
    .explorer-folder span { font-size: 10.5px; color: #333; }

    .drive-container { display: flex; align-items: flex-start; gap: 10px; padding: 9px; border-radius: 6px; cursor: pointer; transition: background 0.1s; width: 220px; }
    .drive-container:hover { background: rgba(0,0,0,0.05); }
    .drive-info { flex: 1; }
    .drive-name { font-size: 11.5px; font-weight: 600; color: #000; margin-bottom: 3px; }
    .drive-bar-bg { width: 100%; height: 12px; background: #e0e0e0; border: 1px solid #ccc; border-radius: 2px; overflow: hidden; }
    .drive-bar-fill { height: 100%; background: #0078D7; width: 46%; }
    .drive-subtext { font-size: 10.5px; color: #555; margin-top: 3px; }

    .terminal-body { background: #0c0c0c; color: #cccccc; font-family: 'Cascadia Code', 'Consolas', monospace; height: 100%; padding: 14px; border-radius: 6px; font-size: 12px; line-height: 1.5; overflow-y: auto; }
    .terminal-line { white-space: pre-wrap; word-break: break-all; }
    .terminal-prompt { color: #4cc2ff; }
    .terminal-input-line { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
    .terminal-input-line input { background: transparent; border: none; outline: none; color: #cccccc; font-family: inherit; font-size: 12px; flex: 1; caret-color: #4cc2ff; cursor: text; }

    .browser-bar { display: flex; align-items: center; gap: 5px; padding: 7px 10px; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; background: #f9f9f9; }
    .browser-bar img { width: 15px; height: 15px; cursor: pointer; opacity: 0.65; }
    .browser-bar img:hover { opacity: 1; }
    .browser-url { flex: 1; background: #fff; border: 1px solid #ccc; border-radius: 16px; padding: 5px 12px; color: #000; font-size: 11.5px; outline: none; cursor: text; }

    .notepad-menubar { display: flex; gap: 2px; padding: 5px 10px; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; background: #f9f9f9; }
    .notepad-menubar span { font-size: 11.5px; padding: 3px 9px; border-radius: 4px; cursor: pointer; color: #555; }
    .notepad-menubar span:hover { background: rgba(0,0,0,0.05); color: #000; }
    .notepad-textarea { flex: 1; background: #fff; border: none; outline: none; resize: none; padding: 12px; color: #000; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 13px; line-height: 1.6; cursor: text; }

    .settings-section { padding: 11px 14px; border-bottom: 1px solid #eee; color: #333; }
    .settings-section h4 { font-size: 12.5px; font-weight: 600; margin-bottom: 7px; color: #000; }
    .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 12px; color: #555; cursor: pointer; }

    .calc-display { background: #f0f0f0; border-radius: 6px; padding: 16px; text-align: right; font-size: 30px; font-weight: 300; color: #000; margin-bottom: 9px; min-height: 60px; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .calc-btn { padding: 13px 0; border-radius: 5px; border: none; background: #f9f9f9; color: #000; font-size: 16px; cursor: pointer; font-family: inherit; transition: background 0.1s; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .calc-btn:hover { background: #e5e5e5; }
    .calc-btn:active { background: #d5d5d5; }
    .calc-btn.accent { background: var(--accent); color: #fff; }

    .photos-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .photos-grid div { width: 100px; height: 80px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; opacity: 0.85; cursor: pointer; }

    .store-layout { display: flex; height: 100%; background: #fff; }
    .store-sidebar { width: 52px; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 16px; }
    .store-sidebar i { font-size: 16px; color: #555; cursor: pointer; }
    .store-sidebar i.active { color: var(--accent); }
    .store-content { flex: 1; padding: 20px; }
    .store-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px; width: 130px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; }
    .store-card img { width: 42px; margin-bottom: 10px; }
    .store-card .title { font-size: 12px; font-weight: 600; color: #000; }
    .store-card .price { font-size: 10.5px; color: #555; margin-top: 4px; }

    @media (max-width: 720px) {
      :root { --taskbar-h: 44px; }
      .start-apps { grid-template-columns: repeat(5, 1fr); }
      .window { width: 96vw; height: 78vh; }
      .explorer-nav { width: 140px; }
      .taskbar-search { width: 120px; margin: 0 3px; height: 30px; }
      .taskbar-search input { font-size: 11px; }
      .weather-widget { left: 4px; gap: 4px; padding: 0 4px; }
      .weather-widget img { width: 17px; height: 17px; }
      .weather-temp { font-size: 10.5px; }
      .weather-desc { display: none; }
      .tray-item { padding: 0 3px; height: 28px; gap: 2px; }
      .tray-item img { width: 13px; height: 13px; }
      .lang-stacked { font-size: 8.5px; }
      .tray-clock { padding: 0 6px; height: 32px; }
      .tray-clock span { font-size: 9.5px; }
    }

    @media (max-width: 480px) {
      .start-apps { grid-template-columns: repeat(4, 1fr); }
      .explorer-nav { display: none; }
      .taskbar-search { display: none; }
      .desktop-icon { width: 50px; padding: 4px 3px; }
      .desktop-icon img { width: 28px; height: 28px; }
      .desktop-icon span { font-size: 9px; }
    }

    @media (pointer: coarse) {

<script>
/* ================================================================
   FULLSCREEN CONTROLLER
   ================================================================ */
function isFullscreen() {
  return !!(document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.msFullscreenElement);
}
function hideFsHint() {
  const h = document.getElementById('fs-hint');
  if (h) h.classList.add('hide');
}
function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  } catch (e) {}
}

const FS_MAX_ATTEMPTS = 6;
let fsAttempts = 0;
let fsSucceeded = false;

function tryEnterFullscreen() {
  if (isFullscreen()) { fsSucceeded = true; hideFsHint(); lockLandscape(); return true; }
  if (fsAttempts >= FS_MAX_ATTEMPTS) { hideFsHint(); return false; }
  fsAttempts++;

  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!fn) { hideFsHint(); return false; }

  try {
    const p = fn.call(el, { navigationUI: 'hide' });
    if (p && typeof p.then === 'function') {
      p.then(() => { fsSucceeded = true; hideFsHint(); lockLandscape(); }).catch(() => {});
    } else {
      fsSucceeded = true; hideFsHint(); lockLandscape();
    }
    return true;
  } catch (e) { return false; }
}

const FS_EVENTS = ['pointerdown', 'touchstart', 'click', 'keydown'];
function cleanupFsListeners() {
  FS_EVENTS.forEach(evt => document.removeEventListener(evt, onFsGesture, true));
}
function onFsGesture() {
  if (fsSucceeded || isFullscreen()) { cleanupFsListeners(); return; }
  tryEnterFullscreen();
  if (fsAttempts >= FS_MAX_ATTEMPTS || fsSucceeded) cleanupFsListeners();
}
FS_EVENTS.forEach(evt => document.addEventListener(evt, onFsGesture, { capture: true, passive: true }));

document.addEventListener('fullscreenchange', () => {
  if (isFullscreen()) { fsSucceeded = true; hideFsHint(); lockLandscape(); cleanupFsListeners(); }
});
document.addEventListener('webkitfullscreenchange', () => {
  if (isFullscreen()) { fsSucceeded = true; hideFsHint(); cleanupFsListeners(); }
});
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'f') {
    e.preventDefault();
    if (isFullscreen()) {
      const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (fn) { try { fn.call(document).catch(() => {}); } catch (err) {} }
    } else {
      fsAttempts = 0; fsSucceeded = false; tryEnterFullscreen();
    }
  }
});

/* ================================================================
   INDEXEDDB
   ================================================================ */
let db;
const dbRequest = indexedDB.open("index.db", 1);
dbRequest.onupgradeneeded = (e) => {
  db = e.target.result;
  if (!db.objectStoreNames.contains('state')) db.createObjectStore('state');
};
dbRequest.onsuccess = (e) => { db = e.target.result; loadState(); };

function saveState() {
  if (!db) return;
  const tx = db.transaction('state', 'readwrite');
  tx.objectStore('state').put({
    winLeft: winEl.style.left,
    winTop: winEl.style.top,
    winOpen: winEl.classList.contains('open'),
    currentApp: currentApp,
    isMaximized: isMaximized
  }, 'windowState');
}
function loadState() {
  if (!db) return;
  const tx = db.transaction('state', 'readonly');
  const req = tx.objectStore('state').get('windowState');
  req.onsuccess = () => {
    const state = req.result;
    if (state && state.winOpen && state.currentApp) {
      setTimeout(() => {
        openApp(state.currentApp);
        if (state.isMaximized) { isMaximized = true; applyMaximizedState(); }
        else if (state.winLeft) {
          winEl.style.transition = 'none'; winEl.style.transform = 'none';
          winEl.style.left = state.winLeft; winEl.style.top = state.winTop;
        }
      }, 1900);
    }
  };
}

/* ================================================================
   UI BUILD
   ================================================================ */
function buildUI() {
  let taskbarHTML = '';
  TASKBAR_KEYS.forEach(item => {
    taskbarHTML += `
      <div class="taskbar-icon" data-app="${item.key}" title="${item.label}">
        <img src="${item.img}" alt="${item.label}" draggable="false">
      </div>`;
    if (item.key === 'start') {
      taskbarHTML += `
        <div class="taskbar-search" onclick="document.getElementById('searchInput').focus()">
          <img src="https://img.icons8.com/fluency-systems-filled/48/search.png" alt="Search">
          <input type="text" id="searchInput" placeholder="Search" onkeydown="handleSearch(event)">
        </div>
      `;
    }
  });
  document.getElementById('taskbarCenter').innerHTML = taskbarHTML;

  document.getElementById('startApps').innerHTML = START_KEYS.map(key => {
    const icon = ICONS[key];
    if (!icon) return '';
    return `
      <div class="start-app-item" data-app="${key}">
        <img src="${icon.img}" alt="${icon.label}" draggable="false">
        <span>${icon.label}</span>
      </div>`;
  }).join('');
}

/* ================================================================
   SEARCH  — opens Edge and focuses its built-in new-tab search
   ================================================================ */
function handleSearch(e) {
  if (e.key === 'Enter') {
    const query = e.target.value.trim();
    if (query) {
      e.target.value = '';
      openApp('edge');
      setTimeout(() => {
        const iframe = document.querySelector('.window-body iframe');
        if (!iframe) return;
        try {
          const input = iframe.contentDocument && iframe.contentDocument.querySelector('.nt-search input');
          if (input) { input.value = query; input.focus(); }
        } catch (err) { /* cross-origin — user can type manually */ }
      }, 350);
    }
  }
}

/* ================================================================

   ================================================================ */

const winTitle = document.getElementById('winTitle');
const winIcon = document.getElementById('winIcon');
const winBody = document.getElementById('windowBody');

let isMaximized = false;

function applyMaximizedState() {

  winEl.style.height = 'auto';
  winEl.style.transform = 'none';
}
function applyRestoredState() {
  winEl.style.top = '50%';
  winEl.style.left = '50%';
  winEl.style.right = '';
  winEl.style.bottom = '';
  winEl.style.width = '';
  winEl.style.height = '';

          <div class="settings-row"><span>Background</span><i class="fas fa-chevron-right"></i></div>
          <div class="settings-row"><span>Colors</span><i class="fas fa-chevron-right"></i></div>
          <div class="settings-row"><span>Themes</span><i class="fas fa-chevron-right"></i></div>
        </div>
        <div class="settings-section">
          <h4>About</h4>
          <div class="settings-row"><span>Windows 11 Pro</span><span style="font-size:10.5px;">Build 22631.3155</span></div>
        </div>
      </div>`;
  } else if (key === 'calculator') {
    winBody.innerHTML = `
      <div style="max-width:280px;margin:0 auto;">
        <div class="calc-display">0</div>
        <div class="calc-grid">
          ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='].map(k => `
            <button class="calc-btn ${k==='='?'accent':''}" ${k==='='?'style="grid-column:span 2;"':''}>${k}</button>
          `).join('')}
        </div>
      </div>`;
  } else if (key === 'edge') {
    /* Edge — your custom Edge-like browser in an iframe */
    winBody.style.padding = '0';
    winBody.style.overflow = 'hidden';
    winBody.style.position = 'relative';
    winBody.innerHTML = `
      <iframe
        src="edge.html"
        title="Microsoft Edge"
        style="position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;display:block;"
        allow="clipboard-read; clipboard-write; fullscreen; autoplay">
      </iframe>`;
  } else if (key === 'photos') {
    winBody.innerHTML = `
      <div style="padding:8px;">
        <div class="photos-grid">
          ${[1,2,3,4,5,6].map(i => `
            <div style="background:linear-gradient(135deg,hsl(${i*55},60%,45%),hsl(${i*55+40},70%,35%));">
              <i class="fas fa-image"></i>
            </div>`).join('')}
        </div>
        <p style="font-size:10.5px;color:#888;margin-top:10px;">Sample photos · Add your own images here</p>
      </div>`;
  } else {
    winBody.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#888;gap:10px;">
        <img src="${icon.img}" width="52" style="opacity:0.5;" onerror="this.style.display='none'">
        <h2 style="font-weight:400;color:#000;">${icon.label}</h2>
        <p style="font-size:11.5px;">This app is ready to launch.</p>
      </div>`;
  }

  winEl.classList.add('open');
  currentApp = key;
  document.querySelectorAll('.taskbar-icon').forEach(el => {
    el.classList.toggle('active-app', el.dataset.app === key);
  });
  document.getElementById('startMenu').classList.remove('open');
  document.getElementById('desktop').classList.remove('blurred');
  closeFlyout();
  saveState();
}

function minimizeApp() { winEl.classList.remove('open'); saveState(); }
function closeApp() {
  winEl.classList.remove('open');
  currentApp = null;
  isMaximized = false;
  applyRestoredState();
  document.querySelectorAll('.taskbar-icon').forEach(el => el.classList.remove('active-app'));
  saveState();
}

/* ================================================================
   TERMINAL
   ================================================================ */
function initTerminal() {
  const input = document.getElementById('terminalInput');
  const body = document.getElementById('terminalBody');
  if (!input || !body) return;
  input.focus();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const cmd = input.value.trim();
      const line = document.createElement('div');
      line.className = 'terminal-line';
      line.innerHTML = `<span class="terminal-prompt">C:\\Users\\User&gt;</span> ${cmd}`;
      body.insertBefore(line, body.lastElementChild);

      const resp = document.createElement('div');
      resp.className = 'terminal-line';
      if (cmd.toLowerCase() === 'dir') {
        resp.textContent = '  Directory of C:\\Users\\User\n\n03/15/2025  10:24 AM    <DIR>          Desktop\n03/15/2025  10:24 AM    <DIR>          Documents\n03/15/2025  10:24 AM    <DIR>          Downloads';
      } else if (cmd.toLowerCase() === 'cls') {
        body.querySelectorAll('.terminal-line').forEach((l, i) => { if (i > 2) l.remove(); });
        resp.textContent = '';
      } else if (cmd.toLowerCase().startsWith('echo ')) {
        resp.textContent = cmd.slice(5);
      } else if (cmd === '') {
        resp.textContent = '';
      } else {
        resp.textContent = `'${cmd}' is not recognized as an internal or external command.`;
      }
      if (resp.textContent) body.insertBefore(resp, body.lastElementChild);
      input.value = '';
      body.scrollTop = body.scrollHeight;
    }
  });
}

/* ================================================================
   CONTEXT MENU
   ================================================================ */
const contextMenu = document.getElementById('contextMenu');
let contextMenuOpenedAt = 0;

function showContextMenuAt(x, y) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = contextMenu.offsetWidth || 180;
  const h = contextMenu.offsetHeight || 160;
  x = Math.max(4, Math.min(x, vw - w - 4));
  y = Math.max(4, Math.min(y, vh - h - 4));
  contextMenu.style.left = x + 'px';
  contextMenu.style.top = y + 'px';
  contextMenu.style.display = 'block';
  contextMenuOpenedAt = Date.now();
}
function closeContextMenu() { contextMenu.style.display = 'none'; }

function showIconContextMenu(x, y, appKey) {
  const icon = ICONS[appKey];
  contextMenu.innerHTML = `
    <div class="context-item" data-action="open"><i class="fas fa-folder-open"></i> Open</div>
    <div class="context-sep"></div>
    <div class="context-item" data-action="cut"><i class="fas fa-cut"></i> Cut</div>
    <div class="context-item" data-action="copy"><i class="fas fa-copy"></i> Copy</div>
    <div class="context-item" data-action="rename"><i class="fas fa-pen"></i> Rename</div>
    <div class="context-item" data-action="delete"><i class="fas fa-trash"></i> Delete</div>
    <div class="context-sep"></div>
    <div class="context-item" data-action="properties"><i class="fas fa-circle-info"></i> Properties</div>
  `;
  contextMenu.querySelectorAll('.context-item').forEach(item => {
    item.onclick = (ev) => {
      ev.stopPropagation();
      const action = item.dataset.action;
      if (action === 'open') openApp(appKey);
      else if (action === 'properties') {
        winTitle.textContent = icon.label + ' Properties';
        winBody.innerHTML = `<div style="padding:8px;"><b>${icon.label}</b><br>Type: Application<br>Size: 0 KB</div>`;
        winEl.classList.add('open');
        currentApp = 'properties';
      }
      closeContextMenu();
    };
  });
  showContextMenuAt(x, y);
}

function showDesktopContextMenu(x, y) {
  contextMenu.innerHTML = `
    <div class="context-item" data-action="refresh"><i class="fas fa-sync-alt"></i> Refresh</div>
    <div class="context-sep"></div>
    <div class="context-item" data-action="personalize"><i class="fas fa-palette"></i> Personalization</div>
    <div class="context-item" data-action="display"><i class="fas fa-desktop"></i> Display settings</div>
    <div class="context-item" data-action="new"><i class="fas fa-plus"></i> New</div>
  `;
  contextMenu.querySelectorAll('.context-item').forEach(item => {
    item.onclick = (ev) => {
      ev.stopPropagation();
      const action = item.dataset.action;
      if (action === 'refresh') location.reload();
      else if (action === 'personalize' || action === 'display') openApp('settings');
      closeContextMenu();
    };
  });
  showContextMenuAt(x, y);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.context-menu')) {
    if (Date.now() - contextMenuOpenedAt < 350) return;
    closeContextMenu();
  }
});

/* ================================================================
   DESKTOP ICONS
   ================================================================ */
function selectIcon(icon) {
  document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
  icon.classList.add('selected');
}
function deselectAllIcons() {
  document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
}

let iconTapCount = 0;
let iconTapTimer = null;

document.querySelectorAll('.desktop-icon').forEach(icon => {
  icon.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button === 2) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    e.stopPropagation();
    iconTapCount++;
    clearTimeout(iconTapTimer);

    if (iconTapCount === 1) {
      iconTapTimer = setTimeout(() => {
        selectIcon(icon);
        iconTapCount = 0;
      }, 320);
    } else if (iconTapCount === 2) {
      iconTapTimer = setTimeout(() => {
        selectIcon(icon);
        openApp(icon.dataset.app);
        iconTapCount = 0;
      }, 320);
    } else if (iconTapCount >= 3) {
      clearTimeout(iconTapTimer);
      iconTapCount = 0;
      const rect = icon.getBoundingClientRect();
      showIconContextMenu(rect.left + rect.width / 2, rect.bottom + 4, icon.dataset.app);
    }
  });

  icon.addEventListener('dblclick', (e) => {
    if (e.pointerType === 'mouse' || !e.pointerType) {
      selectIcon(icon);
      openApp(icon.dataset.app);
    }
  });

  icon.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();
    selectIcon(icon);
    showIconContextMenu(e.clientX, e.clientY, icon.dataset.app);
  });
});

/* ================================================================
   DESKTOP SURFACE + MARQUEE SELECTION
   ================================================================ */
const desktopSurface = document.getElementById('desktopSurface');

desktopSurface.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (e.target.closest('.desktop-icon')) return;
  showDesktopContextMenu(e.clientX, e.clientY);
});

let surfaceTapCount = 0;
let surfaceTapTimer = null;

desktopSurface.addEventListener('pointerdown', (e) => {
  if (e.target !== desktopSurface) return;
  if (e.pointerType === 'mouse' && e.button === 2) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  surfaceTapCount++;
  clearTimeout(surfaceTapTimer);

  if (surfaceTapCount >= 3) {
    clearTimeout(surfaceTapTimer);
    surfaceTapCount = 0;
    showDesktopContextMenu(e.clientX, e.clientY);
    return;
  }
  surfaceTapTimer = setTimeout(() => { surfaceTapCount = 0; }, 400);
});

/* ---- Marquee selection ---- */
const selectionBox = document.getElementById('selection-box');
let isSelecting = false, selStartX = 0, selStartY = 0, didDrag = false;
let suppressDeselect = false;

desktopSurface.addEventListener('mousedown', (e) => {
  if (e.target !== desktopSurface) return;
  if (e.button !== 0) return;
  isSelecting = true;
  didDrag = false;
  selStartX = e.clientX;
  selStartY = e.clientY;
  selectionBox.style.left = selStartX + 'px';
  selectionBox.style.top = selStartY + 'px';
  selectionBox.style.width = '0px';
  selectionBox.style.height = '0px';
  selectionBox.style.display = 'block';
});

document.addEventListener('mousemove', (e) => {
  if (!isSelecting) return;

  const w = Math.abs(e.clientX - selStartX);
  const h = Math.abs(e.clientY - selStartY);
  if (w > 4 || h > 4) didDrag = true;

  const boxLeft = Math.min(e.clientX, selStartX);
  const boxTop  = Math.min(e.clientY, selStartY);
  const boxRight  = boxLeft + w;
  const boxBottom = boxTop  + h;

  selectionBox.style.left = boxLeft + 'px';
  selectionBox.style.top  = boxTop  + 'px';
  selectionBox.style.width  = w + 'px';
  selectionBox.style.height = h + 'px';

  document.querySelectorAll('.desktop-icon').forEach(icon => {
    const r = icon.getBoundingClientRect();
    const hit = !(r.right < boxLeft || r.left > boxRight || r.bottom < boxTop || r.top > boxBottom);
    icon.classList.toggle('selected', hit);
  });
});

document.addEventListener('mouseup', () => {
  if (!isSelecting) return;
  isSelecting = false;
  setTimeout(() => { selectionBox.style.display = 'none'; }, 90);

  if (didDrag) {
    suppressDeselect = true;
    setTimeout(() => { suppressDeselect = false; }, 60);
  }
});

desktopSurface.addEventListener('click', (e) => {
  if (e.target !== desktopSurface) return;
  if (suppressDeselect) return;
  deselectAllIcons();
  document.getElementById('startMenu').classList.remove('open');
  document.getElementById('desktop').classList.remove('blurred');
  closeFlyout();
});

/* ================================================================
   TRAY FLYOUT
   ================================================================ */
const trayFlyout = document.getElementById('trayFlyout');
const flyoutTitle = document.getElementById('flyoutTitle');
const flyoutContent = document.getElementById('flyoutContent');

function closeFlyout() { trayFlyout.classList.remove('open'); }

document.querySelectorAll('.tray-item, .tray-clock').forEach(item => {
  item.addEventListener('click', (e) => {
    e.stopPropagation();
    const type = item.dataset.tray;
    if (trayFlyout.classList.contains('open') && trayFlyout.dataset.active === type) { closeFlyout(); return; }
    trayFlyout.dataset.active = type;
    flyoutContent.innerHTML = '';

    if (type === 'update') {
      flyoutTitle.textContent = 'Hidden Icons';
      flyoutContent.innerHTML = '<div class="flyout-row"><span>No hidden icons</span></div>';
    } else if (type === 'sync') {
      flyoutTitle.textContent = 'Sync Center';
      flyoutContent.innerHTML = '<div class="flyout-row"><span>Sync is active</span><i class="fas fa-sync" style="color:var(--accent);"></i></div><div class="flyout-row" style="font-size:11px;color:#888;margin-top:4px;">No conflicts found.</div>';
    } else if (type === 'onedrive') {
      flyoutTitle.textContent = 'OneDrive';
      flyoutContent.innerHTML = '<div class="flyout-row"><span>Files are up to date</span><i class="fas fa-cloud" style="color:var(--accent);"></i></div><div class="flyout-row" style="font-size:11px;color:#888;margin-top:4px;">2.4 GB of 5 GB used</div>';
    } else if (type === 'lang') {
      flyoutTitle.textContent = 'Language';
      flyoutContent.innerHTML = '<div class="flyout-row active"><span>English (ENG)</span><i class="fas fa-check"></i></div><div class="flyout-row"><span>India (IN)</span></div>';
    } else if (type === 'wifi') {
      flyoutTitle.textContent = 'Wi-Fi';
      flyoutContent.innerHTML = '<div class="flyout-row"><span>Wi-Fi</span><div class="settings-toggle on" onclick="this.classList.toggle(\'on\');event.stopPropagation();"></div></div><div class="flyout-row" style="margin-top:6px;color:var(--accent);font-size:11px;">Available Networks:</div><div class="flyout-row" style="font-size:11px;">Home_Network_5G</div>';
    } else if (type === 'sound') {
      flyoutTitle.textContent = 'Sound';
      flyoutContent.innerHTML = '<div class="flyout-row"><span>Volume</span><span id="volText">75%</span></div><input type="range" min="0" max="100" value="75" id="volSlider" style="width:100%;accent-color:var(--accent);cursor:pointer;" onclick="event.stopPropagation();">';
      setTimeout(() => {
        const vs = document.getElementById('volSlider'), vt = document.getElementById('volText');
        if (vs && vt) vs.addEventListener('input', (e) => { vt.textContent = e.target.value + '%'; });
      }, 10);
    } else if (type === 'battery') {
      flyoutTitle.textContent = 'Battery';
      flyoutContent.innerHTML = '<div class="flyout-row"><span>87% remaining</span><i class="fas fa-battery-full" style="color:var(--accent);"></i></div><div class="flyout-row"><span>Battery saver</span><div class="settings-toggle" onclick="this.classList.toggle(\'on\');event.stopPropagation();"></div></div>';
    } else if (type === 'clock') {
      flyoutTitle.textContent = 'Calendar';
      flyoutContent.innerHTML = '<div class="flyout-row"><span>No new notifications</span></div><div class="flyout-row" style="margin-top:6px;font-size:11px;color:var(--accent);">Open Calendar</div>';
    }
    trayFlyout.classList.add('open');
  });
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.tray-item') && !e.target.closest('.tray-clock') && !e.target.closest('.tray-flyout')) closeFlyout();
});

/* ================================================================
   TASKBAR + START MENU
   ================================================================ */
const startMenu = document.getElementById('startMenu');
const desktop = document.getElementById('desktop');

document.getElementById('taskbarCenter').addEventListener('click', (e) => {
  const icon = e.target.closest('.taskbar-icon');
  if (!icon) return;
  const appKey = icon.dataset.app;
  if (appKey === 'start') {
    const isOpen = startMenu.classList.contains('open');
    startMenu.classList.toggle('open');
    desktop.classList.toggle('blurred', !isOpen);
    return;
  }
  openApp(appKey);
});

document.getElementById('startApps').addEventListener('click', (e) => {
  const app = e.target.closest('.start-app-item');
  if (!app) return;
  openApp(app.dataset.app);
});

/* ================================================================
   WINDOW CONTROLS
   ================================================================ */
document.getElementById('winClose').addEventListener('click', closeApp);
document.getElementById('winMinimize').addEventListener('click', minimizeApp);
document.getElementById('winMaximize').addEventListener('click', () => {
  isMaximized = !isMaximized;
  if (isMaximized) applyMaximizedState();
  else applyRestoredState();
  saveState();
});

(function initDrag() {
  const header = document.getElementById('windowHeader');
  let isDragging = false, offsetX = 0, offsetY = 0;

  function startDrag(e) {
    if (e.target.closest('.win-btn')) return;
    if (isMaximized) return;
    isDragging = true;
    const rect = winEl.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    offsetX = cx - rect.left;
    offsetY = cy - rect.top;
    winEl.style.transition = 'none';
    winEl.style.transform = 'none';
    winEl.style.left = rect.left + 'px';
    winEl.style.top = rect.top + 'px';
  }
  function moveDrag(e) {
    if (!isDragging) return;
    e.preventDefault();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    let newX = cx - offsetX, newY = cy - offsetY;
    newX = Math.max(0, Math.min(window.innerWidth - winEl.offsetWidth, newX));
    newY = Math.max(0, Math.min(window.innerHeight - winEl.offsetHeight - 56, newY));
    winEl.style.left = newX + 'px';
    winEl.style.top = newY + 'px';
  }
  function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    winEl.style.transition = '';
    saveState();
  }
  header.addEventListener('mousedown', startDrag);
  document.addEventListener('mousemove', moveDrag);
  document.addEventListener('mouseup', endDrag);
  header.addEventListener('touchstart', startDrag, { passive: false });
  document.addEventListener('touchmove', moveDrag, { passive: false });
  document.addEventListener('touchend', endDrag);
})();

/* ================================================================
   CLOCK
   ================================================================ */
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  const day = String(now.getDate()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const year = now.getFullYear();
  document.getElementById('trayTime').textContent = time;
  document.getElementById('trayDate').textContent = `${day}-${month}-${year}`;
}
setInterval(updateClock, 1000);
updateClock();

/* ================================================================
   ORIENTATION / RESIZE
   ================================================================ */
function handleResize() {
  if (winEl.classList.contains('open') && !isMaximized) {
    const rect = winEl.getBoundingClientRect();
    if (rect.right > window.innerWidth || rect.bottom > window.innerHeight || rect.left < 0 || rect.top < 0) {
      winEl.style.left = '50%';
      winEl.style.top = '50%';
      winEl.style.transform = 'translate(-50%, -50%) scale(1)';
    }
  }
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => setTimeout(handleResize, 250));

/* ================================================================
   BOOT
   ================================================================ */
window.addEventListener('load', () => {
  buildUI();
  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hidden');
    const startupSound = new Audio('https://files.catbox.moe/a6tds4.mp3');
    startupSound.play().catch(e => console.log('Audio playback blocked:', e));
    if (!isFullscreen()) {
      const hint = document.getElementById('fs-hint');
      if (hint) {
        hint.style.display = 'block';
        setTimeout(hideFsHint, 7000);
      }
    }
  }, 1800);
});

/* Escape closes window/menu */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (winEl.classList.contains('open')) minimizeApp();
    else if (startMenu.classList.contains('open')) { startMenu.classList.remove('open'); desktop.classList.remove('blurred'); }
    closeFlyout();
    closeContextMenu();
  }
});
</script>
